
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | UOK Fee Portal</title>
</head>
<body>
    <h2>Reset Your Password</h2>

    <p>Enter the email address you used when registering your student account.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Send Reset Link</button>
    </form>

    <p><a href="{% url 'student_login' %}">Back to Login</a></p>
</body>
</html>
