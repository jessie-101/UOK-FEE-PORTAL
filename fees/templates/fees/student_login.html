{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOK Fee Portal - Student Login</title>
    <link rel="stylesheet" href="{% static 'fees/css/style.css' %}">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div>
                <h2>UOK Fee Portal</h2>
                <p>Student Account Login</p>
            </div>
        </div>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h2>Student Login</h2>
            <p>Sign in to access your fee account.</p>

            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Admission Number</label>
                    <input type="text" name="admission_number"
                           placeholder="Enter your admission number" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="form-footer">
                Don't have an account?
                <a href="{% url 'student_register' %}">Register here</a>
            </p>
        </div>
    </main>

</body>
</html>
